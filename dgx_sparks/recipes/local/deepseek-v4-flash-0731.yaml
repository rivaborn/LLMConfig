# Recipe: DeepSeek-V4-Flash-0731  (2-node tensor-parallel, local fork)
#
# The OFFICIAL release superseding the -Preview this lab served as
# `deepseek-v4-flash` until 2026-07-31: native FP8, ~167 GB, 304B MoE,
# SAME architecture as -DSpark (the spec-decode module ships in the model),
# and substantially stronger agentic scores (Terminal Bench 82.7 vs 61.8,
# DeepSWE 54.4 vs 7.3). Model card: huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
#
# Based on ../local/deepseek-v4-flash-dspark.yaml — READ ITS HEADER for the
# two load-bearing constraints inherited verbatim:
#   1. Runs on the PATCHED **vllm-node-dspark** image (FlashInfer PR 3817),
#      staged on all four nodes since the 2026-07-31 fleet-parity pass.
#   2. Every JSON argument is SINGLE-BRACE + LITERAL (sparkrun's renderer
#      cannot substitute inside braces — the {{...}} form fails silently).
#      num_speculative_tokens is therefore NOT catalog-tunable; edit here.
#
# Deltas from the DSpark fork:
#   - model: the official 0731 repo (FP8; encoding/ handled by
#     --tokenizer-mode deepseek_v4, proven on this image by the DSpark fork).
#   - spec-decode per the model card: 7 draft tokens + greedy draft sampling
#     (image validates >= dspark_block_size 5; 7 passes). FALLBACK LADDER if
#     config parse rejects it: drop "draft_sample_method" first (older builds
#     may not know the key), then 7 -> 5.
#   - dspark_noise_token_id hf-override DROPPED: the preview-DSpark repo
#     lacked it in config; the official release should declare it natively.
#     Re-add '{"dspark_noise_token_id":128799}' if launch complains.
#   - GB300-isms from the model card's reference command deliberately absent
#     (--data-parallel-size, --enable-expert-parallel, deep_gemm_mega_moe,
#     fp4 indexer cache) — optimizations for hardware this cluster is not.
#
# Window: 262144 to start, same estimator-distrust rationale as the DSpark
# fork (the card claims million-token capability — raise only after measuring
# the real KV pool at fp8 on GB10).

recipe_version: "1"
name: DeepSeek-V4-Flash-0731
description: vLLM serving deepseek-ai/DeepSeek-V4-Flash-0731 (official release) on 2 DGX Sparks

model: deepseek-ai/DeepSeek-V4-Flash-0731

container: vllm-node-dspark

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  block_size: 256
  max_num_seqs: 4
  max_num_batched_tokens: 10240

env:
  DG_JIT_USE_NVRTC: "0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"

# PREFIX CACHING IS EXPLICITLY OFF — and it must be PASSED, not merely omitted.
#
# 2026-08-02, the hard way: the first version of this recipe said "prefix
# caching deliberately absent", copying the DSpark fork's wording. But absent
# is NOT disabled — vLLM 0.26 defaults `enable_prefix_caching` to TRUE, so
# omitting the flag leaves it ON, and the engine log confirmed
# `enable_prefix_caching=True`. Combined with dspark speculative decoding that
# does not raise the DSpark thread's `assert kv_block_zeroer is not None`; it
# SILENTLY CORRUPTS OUTPUT. Symptom: a reply starts coherent and degenerates
# into multilingual token salad part-way through, and
# `SpecDecoding metrics` show per-position acceptance collapsing to
# `0.027, 0.000, 0.000, ...` (0.2-0.4% avg) on affected requests, against a
# healthy 33.8% with the normal decay curve on unaffected ones.
#
# A short prompt hides it completely — "Say OK" and a single tool call both
# passed validation on 2026-07-31. It takes a few hundred tokens to show.
#
# 2026-08-04 -- TWO further faults found here, both fixed in this file. Measured
# against the live gateway; neither is the 2026-08-02 fault above.
#
#   1. reasoning_effort=high made the model NEVER EMIT CONTENT. With
#      --default-chat-template-kwargs.reasoning_effort=high this build spends the whole
#      budget in the reasoning channel: a ONE-LINE question returned
#      finish_reason=length with empty content at max_tokens 2048 / 4000 / 8192
#      (34k chars of reasoning, zero content), 5 of 5 runs. The flag is absent from the
#      spark-arena reference recipe. Removed here; thinking=true kept. After: that
#      question answers in ~206 tokens finish=stop, and an 8-line code review returns a
#      proper verdict in 895 tokens. Downstream this reads as "reviewer unavailable:
#      empty content" and FAILS OPEN -- the opencode step-gate silently passed ungated
#      steps for two days because of it.
#
#   2. draft_sample_method=greedy corrupted output ~40% of the time. Same visible
#      symptom as the 2026-08-02 note (coherent, then multilingual token salad and
#      place_holder tokens) but NOT the acceptance collapse that note describes:
#      acceptance was a healthy 36.2% with a normal decay curve throughout, so the
#      prefix-caching fix was working and this is a SECOND, INDEPENDENT cause. Greedy
#      drafting breaks the distribution matching that makes speculative decoding
#      lossless, so accepted tokens can diverge from the target model. Baseline 2 of 5
#      runs corrupt; after switching to probabilistic, 0 corrupt over 24,000 generated
#      tokens (the old rate predicted ~8) and acceptance ROSE to 61.3%.
#
#   Do NOT copy spark-arena num_speculative_tokens:3 -- this image hard-validates
#   num_speculative_tokens >= dspark_block_size (5) and refuses to start, saying
#   "Smaller values produce incorrect output". Arena runs a different image
#   (ghcr.io/anemll/dspark-vllm-gx10:0.1.1, not staged on any node here). 5 is the
#   minimum legal value on vllm-node-dspark; this recipe now runs 5 + probabilistic.
#
#   Corruption is INTERMITTENT, so a single clean probe proves nothing -- verify with
#   10+ runs AND force long generations: fixing (1) shortens replies to ~200 tokens,
#   which hides (2) by shrinking the window it needs to appear.
# load-format safetensors is inherited from the DSpark fork (instanttensor
# crashes on this build). Expect a slow first load.
command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --no-enable-prefix-caching \
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}' \
      --tokenizer-mode deepseek_v4 \
      --distributed-executor-backend ray \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --default-chat-template-kwargs.thinking=true \
      --load-format safetensors
