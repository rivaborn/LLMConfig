# Recipe: GPT-OSS 120B  (single-node, local)
#
# LOCAL RECIPE — the tp=1 sibling of gpt-oss-120b-x2.yaml (read its header for
# the full story). The only registry recipe, @eugr/openai-gpt-oss-120b, runs on
# `vllm-node-mxfp4` — a custom image (`--exp-mxfp4` build) that exists on NO
# node here and would have to be built first. The ghcr nightly supports the
# MXFP4 checkpoint NATIVELY, so this recipe replaces that unbuildable
# dependency with the image family the fleet is standardizing on anyway
# (the vllm-node 0.23.1 retirement path).
#
# Same flags as the -x2 recipe minus the distributed bits. Community numbers
# (Spark Arena, pulled 2026-07-23) say 1 node is the FASTEST shape for this
# model (~58.8 t/s decode) — this is the recipe you actually want day-to-day;
# -x2 exists for the pair-testing plan.
#
# Weights: openai/gpt-oss-120b, ~61 GB, staged on all four nodes (2026-07-30).
# No mem_fraction is declared in the catalog for gpt-oss-120b (whole-node
# claim), matching gpu_memory_utilization 0.8 here.
#
# No {{...}} in the command — see the render-bug rule in README.md.

recipe_version: "2"
model: openai/gpt-oss-120b
runtime: vllm
min_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: OpenAI GPT-OSS 120B (MXFP4) on one DGX Spark, nightly image

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  # gpt-oss-120b native context.
  max_model_len: 131072
  load_format: fastsafetensors
  max_num_batched_tokens: 8192

command: |
  vllm serve {model} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --max-model-len {max_model_len} \
    --load-format {load_format} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser openai \
    --reasoning-parser openai_gptoss \
    --host {host} \
    --port {port}
