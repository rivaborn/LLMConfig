recipe_version: "2"
model: microsoft/harrier-oss-v1-0.6b
runtime: vllm
max_nodes: 1
container: eugr/spark-vllm@sha256:4cfcfa3b79d22759dd27e53da164019199ee0b94bf90c1c849a803ceeb76fdaa

metadata:
  description: >
    harrier-oss-v1-0.6b - text embedding model, 1024-dim, Qwen3Model
    architecture. Staged 2026-08-06 for the LitRank embedding bake-off as a
    same-size challenger to the incumbent Qwen3-Embedding-0.6B. Its query
    prompt convention ("Instruct: ...\nQuery:") matches the contract
    build_embeddings.py already implements.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.2
  max_model_len: 32768
  load_format: safetensors

command: |
  vllm serve {model} \
    --runner pooling \
    --gpu-memory-utilization {gpu_memory_utilization} \
    -tp {tensor_parallel} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --load-format {load_format}
