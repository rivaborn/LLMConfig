# Recipe: Qwen3.5-122B-INT4-Autoround  on the NIGHTLY image  ("-nightly")
#
# LOCAL FORK of @eugr/qwen3.5-122b-int4-autoround with exactly TWO deliberate
# differences:
#
#   1. `container:` is the ghcr NIGHTLY (vLLM 0.26.x), not `vllm-node` (0.23.1).
#   2. `env: VLLM_MARLIN_USE_ATOMIC_ADD` ships as 0, not 1 (the GB10 marlin
#      split-K CUDA-graph-capture killer — same belt-and-braces as the -ft fork,
#      so a forgotten catalog override can never make this unlaunchable).
#
# WHY THIS FORK EXISTS — vllm-node 0.23.1 is being retired as a dependency.
# On 2026-07-30 that image began failing engine start with
#   AttributeError: 'ShmRingBuffer' object has no attribute 'shared_memory'
# on a GROWING set of nodes: spark2 all day (4/4), spark4 from ~17:38 EDT
# (gemma x2, this very model x1) after a morning of successes. The fault is
# image-wide and model-independent on afflicted nodes, survives reboot and
# full power-drain, and no 0.26.x-image model shows it anywhere. Root cause
# unidentified; the engineering decision is to move off the image rather than
# keep debugging a months-old rc build. This recipe is the 122B's landing spot.
#
# Everything else is byte-identical to upstream ON PURPOSE, including
# fastsafetensors (the nightly's official recipes use it too), qwen3_xml /
# qwen3 parsers, and the eugr chat-template mod (copied into local/mods/ so
# this file is self-contained; sparkrun resolves mods adjacent to the recipe
# first). If a flag turns out to have moved between vLLM 0.23 and 0.26, change
# it HERE with a note — the first verification launch is the test.
#
# status: UNVERIFIED until launched. First target: spark4 (an afflicted node —
# success there is the real proof).

recipe_version: "1"
name: Qwen3.5-122B-INT4-Autoround-nightly
description: vLLM serving Qwen3.5-122B-INT4-Autoround on the nightly image (vllm-node 0.23.1 retirement)
model: Intel/Qwen3.5-122B-A10B-int4-AutoRound
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
mods:
  - mods/fix-qwen3.5-chat-template
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 0
command: |
  vllm serve Intel/Qwen3.5-122B-A10B-int4-AutoRound \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
