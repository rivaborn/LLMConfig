# Curated sparkrun recipes for a single DGX Spark (GB10) node.
#
# Seeded into ../../data/spark_models_<unit>.yaml on first run, then editable per
# node through the UI / API. sparkrun's synced registries carry ~147 models; this
# is the small set this lab actually serves, mirroring the vLLM alias registry.
#
# `recipe` must be a name sparkrun can resolve — they are NAMESPACED by registry
# (`@eugr/…`, `@official/…`, `@sparkrun-transitional/…`). Check with
# `sparkrun search <text>` or `sparkrun list`; a bare guess fails with
# "Recipe '<name>' not found".
#
# `served_name` is pinned onto the launch via `--served-model-name`, so the node
# reports exactly this string and readiness/`/v1` resolution can't drift from
# whatever the recipe would otherwise default to. It is also the id you use as
# `model` against the /v1 gateway.
#
# tp = node count. Everything here is tp: 1 — the 200G switch has not been
# delivered, so the four Sparks run as independent single-node servers. Raise tp
# only after the fabric is up (see the wiki runbook), and only for a recipe whose
# `Nodes` column in `sparkrun list` supports it.
#
# mem_fraction sizing on GB10 (learned live 2026-07-26, twice):
# 1) vLLM charges ~15 GiB of NON-TORCH overhead against --gpu-mem on this
#    unified-memory platform, on top of weights and KV. Budget =
#    (weights + ~15 GiB + KV + margin) / 121. Sized on weights+KV alone, boot
#    dies at "Available KV cache memory: -X GiB" in ~45 s (the embedder's 0.18).
# 2) The NODE also needs INFERENCE headroom outside every budget: Triton JIT
#    workspace, cudagraph capture, and prefill activations are invisible to
#    boot-time checks. The 122B at 0.85 BOOTED (94.8% pool) and died on its
#    FIRST TOKEN (RayWorker killed, NVRM NV_ERR_NO_MEMORY). Keep total node
#    occupancy after load ≤ ~90%; a budget that passes boot can still be fatal.
#
# status: "unverified" until it has been launched and recall-tested on THIS
# cluster. The decode figures in the notes are community numbers from the Spark
# Arena leaderboard, not measurements from this lab.
models:
  # The first model actually launched on this cluster (shakedown 2026-07-24).
  # The recipe defaults to tensor_parallel: 2 and max_model_len: 262144 — sized for
  # two nodes. On one node that KV cache does not fit beside the weights at
  # gpu_memory_utilization 0.8, so tp is 1 here and the context is pinned in
  # extra_args. Raise both only after the 200G switch makes multi-node real.
  # served_name carries the quant, following the vLLM-registry convention
  # (coder30-awq, q36-27b-abl). It must NOT be a bare "gemma-4-26b": the 3090
  # already serves that name from cyankiwi/…-AWQ-4bit at 32k ctx, and an
  # un-laned /v1 request silently resolved to that instead of this fp8/65k build
  # — same model id, different weights and half the context.
  - alias: gemma-4-26b
    recipe: "@eugr/gemma4-26b-a4b"
    served_name: gemma-4-26b-fp8
    tp: 1
    status: ok
    needs_empty_node: true   # quantize-at-load ~74 GB transient — runbook: load-order landmine
    mem_fraction: 0.4    # PROVEN live: 26 fp8 weights + ~15 overhead + 8 KV = 49 GB vs 48.4 budget — barely fits.
    extra_args: ["--max-model-len", "65536"]
    notes: >-
      google/gemma-4-26B-A4B-it, MoE 26B/4B-active, served fp8 with fp8 KV.
      65536 ctx clears opencode's ~24.5k baseline with room. VERIFIED on all four
      nodes 2026-07-24 — real completions through the LLMConfig /v1 gateway in
      0.6-1.1 s. Weights download as ~48 GB bf16 and are QUANTIZED AT LOAD, so
      (a) a node's first-ever load is a long pull (~50 min cold; ~10 min cached), and
      (b) the load-time transient is ~74 GB — nearly double the 0.40 runtime budget —
      so gemma MUST BE THE FIRST MODEL ON ITS NODE (loading it beside a resident
      trips Ray's 95% node-memory kill; proven 3x on 2026-07-26). Pre-quantized
      co-tenants join safely afterwards.
    load_timeout_s: 3600

  - alias: gpt-oss-120b
    recipe: "@eugr/openai-gpt-oss-120b"
    served_name: gpt-oss-120b
    tp: 1
    status: unverified
    # No mem_fraction: an MXFP4 120B is most of the pool, so it claims the whole
    # node (0.0 = unset = whole-node claim, and LLMConfig refuses to co-schedule
    # anything alongside an unbudgeted model).
    extra_args: ["--max-model-len", "65536"]
    notes: "MXFP4 via vllm-distributed. Community 1-node decode ~58.8 t/s, strong prefill (~6000 t/s)."
    load_timeout_s: 1200

  - alias: qwen3-coder-next
    recipe: "@official/qwen3-coder-next-int4-autoround-vllm"
    served_name: qwen3-coder-next
    tp: 1
    status: unverified
    mem_fraction: 0.6    # 40.53 weights + ~15 overhead + 12 KV at 262144 = 67.5 GB; 0.60 = 72.6.
    # 262144 rather than the 65536 the other recipes carry, because this one has
    # room for it and is the coding model: `sparkrun show` puts weights at 40.53 GB
    # (INT4) and the KV at only 12.00 GB for the full 262144 window — the arch is a
    # Mamba-hybrid with 2 KV heads, so KV is cheap. 52.53 GB of the 121 GB pool, and
    # sparkrun's own ceiling is ~965k tokens (3.7x this). Pinning 65536 here would
    # throw away most of what makes the model useful for agentic coding.
    extra_args: ["--max-model-len", "262144"]
    notes: >-
      Intel/Qwen3-Coder-Next-int4-AutoRound, MoE ~3B active — decode on a GB10 is
      bandwidth-bound on ACTIVE params, so this is the fastest single-node option
      (community ~73.3 t/s). Recipe ships --enable-auto-tool-choice with the
      qwen3_coder parser plus prefix caching and chunked prefill, which is the right
      shape for agentic coding. 262144 ctx; weights ~40 GB, first load downloads them.
    load_timeout_s: 1800

  - alias: qwen35-35b-a3b
    recipe: "@sparkrun-transitional/qwen3.5-35b-a3b-fp8-sglang"
    served_name: qwen35-35b-a3b
    tp: 1
    status: unverified
    mem_fraction: 0.5    # ~35 GB FP8 weights + ~15 overhead + KV at 65536 (SGLang overhead unmeasured).
    extra_args: ["--max-model-len", "65536"]
    notes: "FP8 MoE on SGLang. ~50.8 t/s single-stream, ~196 t/s aggregate at c10."
    load_timeout_s: 900

  # Qwen3.6 pair. These replace the Qwen3.5 27B that was originally curated: the
  # @official 3.6 recipes are single-node, run on vLLM rather than SGLang, carry the
  # qwen3_coder tool parser, and add MTP speculative decoding (2 tokens) — the right
  # lever on a GB10, where decode is bound by memory bandwidth on active params.
  # They also halve the KV cost of their 3.5 equivalents, per `sparkrun show`:
  #   3.6-35B-A3B  KV 10 GB vs 20 GB, total 44.9 GB, ceiling 1.62M tokens
  #   3.6-27B      KV 32 GB vs 64 GB, total 60.8 GB, ceiling  557k tokens
  # Both therefore take the full 262144 window comfortably.
  - alias: qwen36-35b-a3b
    recipe: "@official/qwen3.6-35b-a3b-fp8-mtp-vllm"
    served_name: qwen36-35b-a3b
    tp: 1
    status: unverified
    mem_fraction: 0.52   # 34.89 weights + ~15 overhead + 10 KV at 262144 = 59.9 GB; 0.52 = 62.9.
    extra_args: ["--max-model-len", "262144"]
    notes: >-
      Qwen/Qwen3.6-35B-A3B-FP8 with MTP speculative decoding. 34.89 GB weights,
      10 GB KV at 262144 — 44.89 GB of the 121 GB pool.
    load_timeout_s: 1800

  - alias: qwen36-27b
    recipe: "@official/qwen3.6-27b-fp8-mtp-vllm"
    served_name: qwen36-27b
    tp: 1
    status: unverified
    mem_fraction: 0.68   # 28.75 weights + ~15 overhead + 32 KV at 262144 = 75.8 GB; 0.68 = 82.3.
    extra_args: ["--max-model-len", "262144"]
    notes: >-
      Qwen/Qwen3.6-27B-FP8 with MTP speculative decoding. Dense 27B: 28.75 GB
      weights but a heavier 32 GB KV at 262144 — 60.75 GB total.
    load_timeout_s: 1800

  # --- RAG services (pooling runners, NOT chat models) -------------------------
  # Both are `--runner pooling`, Nodes 1-1, and tiny for this hardware: ~20 GB of a
  # 121 GB node. That used to be deliberate waste — one workload per node meant a
  # reranker occupied a whole Spark at ~17% utilisation. It no longer does: a node
  # holds several models, so the pair (0.18 + 0.18) sits beside a chat model with
  # room to spare, each on its own port.
  #
  # They are reachable through the gateway: /v1/embeddings, /v1/rerank and /v1/score
  # route to whichever unit holds the model (address them by `served_name`).
  - alias: qwen3-vl-embedding-8b
    recipe: "@official/qwen3-vl-embedding-8b-vllm"
    served_name: qwen3-vl-embedding-8b
    tp: 1
    status: unverified
    mem_fraction: 0.33   # MEASURED: 0.30 failed by 0.1 GiB (profiled weights ~17 + 14.9 overhead + 4.5 KV); 0.33 = 40 GB.
    extra_args: ["--max-model-len", "32768"]
    notes: >-
      Qwen/Qwen3-VL-Embedding-8B, pooling runner. 15.17 GB weights + 4.50 GB KV at
      32768 = 19.67 GB. Multimodal embeddings (text + image) for RAG.
    load_timeout_s: 900

  - alias: qwen3-vl-reranker-8b
    recipe: "@official/qwen3-vl-reranker-8b-vllm"
    served_name: qwen3-vl-reranker-8b
    tp: 1
    status: unverified
    needs_empty_node: true   # fastsafetensors loader kills residents at launch — runbook rule
    mem_fraction: 0.35   # ~18 profiled weights + ~15 overhead + 4.5 KV; sized off the embedder's measured failure.
    extra_args: ["--max-model-len", "32768"]
    notes: >-
      Qwen/Qwen3-VL-Reranker-8B, pooling runner. 16.33 GB weights + 4.50 GB KV at
      32768 = 20.83 GB. Cross-encoder reranking -- usually a bigger RAG quality win
      than swapping the embedder. The lab had no reranker before this.
    load_timeout_s: 900

  # Single-node 122B. The FP8 sibling (118.43 GB of weights) cannot fit one 121 GB
  # node at all -- sparkrun reports `Nodes: 2 - unlimited` for it -- so INT4 is the
  # ONLY way to run this model on one Spark, not merely a cheaper way.
  #
  # tp: 1 deliberately overrides the recipe default of tensor_parallel: 2. On this
  # cluster one node is one GPU, so tp 2 means every layer's all-reduce crosses the
  # 200G fabric (10-23 GB/s) instead of staying in local memory (273 GB/s). Decode
  # is bandwidth-bound on the ~10B active params, so single-node INT4 should decode
  # FASTER than the 2-node FP8 build, not slower -- two nodes buy quality and KV
  # headroom here, not speed.
  #
  # 262144 = the model's native window (config.json max_position_embeddings, no rope
  # scaling). This entry ran at 65536 first, because sparkrun estimates KV at 24 GB
  # for the full window, which on top of 71.46 GB of weights would leave ~1.3 GB of
  # margin against the ~96.8 GB usable at util 0.8. THAT ESTIMATE IS ~4x TOO HIGH,
  # and it is now measured rather than argued.
  #
  # config.json shows a HYBRID stack:
  #   layer_types = 36 x linear_attention + 12 x full_attention  (48 layers total)
  # Only the 12 full-attention layers keep a KV cache that grows with context; the
  # linear-attention layers hold a fixed-size recurrent state. sparkrun's estimator
  # appears to charge all 48 (2*48*2 kv_heads*256 head_dim*2 B = 98304 B/token gives
  # exactly its 24 GB figure). Counting only the 12 predicted ~6.4 GB at 262144.
  # The live load reported a 31.2 GiB pool holding 1,121,010 tokens, i.e. 262144
  # tokens ~= 7.3 GiB. Prediction confirmed; treat sparkrun's KV number as an UPPER
  # BOUND on any hybrid model, never as a measurement.
  #
  # WHY RAISING IT IS FREE: `max_model_len` does NOT size the KV pool. vLLM v1
  # allocates the whole leftover budget as KV blocks regardless, and max_model_len
  # only caps how long ONE request may be. Going 65536 -> 262144 therefore costs
  # zero memory; the only thing that changes is the worst-case line vLLM prints,
  # "Maximum concurrency for N tokens per request", 17.11x -> 4.28x. That figure is
  # pool_tokens/max_model_len, not a scheduler limit — short requests are scheduled
  # by blocks actually used and are completely unaffected. Do not read it as a
  # throughput regression.
  #
  # THE RECIPE'S OWN ENV IS A LANDMINE — see the -o override below. This entry is
  # VERIFIED as of 2026-07-29: it loads in ~5 min and serves batched inference.
  #
  # Still untested: --tool-call-parser qwen3_coder instead of the recipe's qwen3_xml.
  # The NVIDIA forum recipe thread reports qwen3_coder is the one that works with
  # opencode, this lab's primary client -- but the parser is baked into the recipe's
  # command template with no placeholder, so changing it needs a recipe fork, not a
  # flag here (see the extra_args note). Verify with a real tool call if you fork.
  # Do NOT switch to --kv-cache-dtype fp8: that thread reports bf16 KV is better here.
  - alias: qwen35-122b-int4
    recipe: "@eugr/qwen3.5-122b-int4-autoround"
    served_name: qwen35-122b-int4
    tp: 1
    status: ok
    # NOT 0.85: at 0.85/131072 the 122B BOOTED (94.8% pool) then died on its FIRST
    # token — RayWorker killed, NVRM NV_ERR_NO_MEMORY. The first forward pass needs
    # Triton-JIT + cudagraph-capture + activation workspace OUTSIDE the vLLM budget,
    # and ~6 GB of node headroom was not enough. 0.80 leaves ~17 GB.
    # Note the two knobs spend DIFFERENT pools and must not be confused: context
    # length spends the KV pool INSIDE the budget, mem_fraction spends the node
    # headroom OUTSIDE it. That is why 65536 -> 262144 is free while 0.80 -> 0.85
    # was fatal, and why raising the context did not re-open that failure.
    mem_fraction: 0.8
    # `-o env.VLLM_MARLIN_USE_ATOMIC_ADD=0` IS LOAD-BEARING — without it this model
    # cannot start at all. The @eugr recipe ships `env: VLLM_MARLIN_USE_ATOMIC_ADD: 1`,
    # and on GB10 that marlin split-K reduction path dies during CUDA-graph capture:
    # weights load fine (62.87 GiB), KV sizes fine (31.2 GiB free, 1.12M tokens), the
    # eager warmup pass runs, then capture #23 of 51 aborts with
    #   CUDA error: an illegal instruction was encountered
    # deferred-reported at torch.ops._C.marlin_gemm inside the inductor graph, and
    # vLLM exits "Engine core initialization failed" (live, 2026-07-29). Note the
    # error is ASYNC — the marlin frame is where it surfaced, not provably where it
    # was raised — but flipping this one env var makes the load succeed, which is the
    # evidence that counts. Nothing about it is a memory problem; do NOT "fix" this by
    # lowering mem_fraction.
    #
    # HOW extra_args ACTUALLY WORK — they are appended to the `sparkrun run` argv,
    # NOT to `vllm serve`. sparkrun 0.2.40 declares a variadic EXTRA_ARGS and then
    # NEVER READS IT (cli/_run.py:92 -- dead click argument), so anything passed
    # after `--` is silently dropped. What DOES reach the server is:
    #   * a real sparkrun option (--max-model-len, --gpu-mem, --port, ...) — which
    #     is the only reason "--max-model-len 262144" below works; and
    #   * `-o key=value`, which overrides a recipe `defaults:` key, and the special
    #     `-o env.NAME=VALUE`, which writes straight into recipe.env (cli/_common.py
    #     "Apply env.* overrides to recipe.env directly").
    # A vLLM-only flag (--enforce-eager, -O.cudagraph_mode=...) has no route here:
    # bare, sparkrun exits "Error: No such option"; after `--` it vanishes; and `-o`
    # only lands if the recipe's command template has a matching {placeholder}, which
    # this one does not. Changing anything else about the launch means forking the
    # recipe yaml into a local registry.
    extra_args: ["--max-model-len", "262144", "-o", "env.VLLM_MARLIN_USE_ATOMIC_ADD=0"]
    notes: >-
      Intel/Qwen3.5-122B-A10B-int4-AutoRound on ONE node. 71.46 GB weights. 262144 ctx
      — the native window, and free: the measured KV pool is 1,121,010 tokens, so
      262144 is 23% of it and raising the cap costs no memory (see the comment above).
      Tool calls via qwen3_xml + reasoning parser qwen3, prefix caching.
      The only single-node 122B; the FP8 build needs 2 nodes.
      Needs -o env.VLLM_MARLIN_USE_ATOMIC_ADD=0 or CUDA-graph capture dies on GB10.
    load_timeout_s: 1800

  # ---- document OCR (datalab-to), added 2026-08-06 -------------------------
  # Two models, one pipeline: surya is the fast one (1.30 GiB), chandra the
  # heavier/more capable (9.88 GiB). Same architecture family
  # (Qwen3_5ForConditionalGeneration), both single-node, both budgeted small
  # enough to be CO-TENANTS rather than node monopolisers.
  #
  # Both are `status: unverified` — neither has launched on a Spark. surya's
  # recipe at least inherits the flag set proven on the 3070 Ti companion
  # lane; chandra's has never run anywhere. Promote them only after a real
  # page has been OCR'd through each.
  - alias: surya-ocr-2
    recipe: /mnt/c/Coding/rivaborn/LLMConfig/dgx_sparks/recipes/local/surya-ocr-2-spark.yaml
    served_name: surya-ocr-2
    tp: 1
    status: unverified
    mem_fraction: 0.12
    load_timeout_s: 900
    notes: >-
      datalab-to/surya-ocr-2 @3b3d4cdf, 1.30 GiB. Layout / OCR / table
      recognition in ONE VLM. Spark sibling of the proven companion-lane
      config, retuned from an 8 GB single-stream shape into a throughput
      service (max_pixels 5419008 = 2048px-wide pages, window 16384, 32
      concurrent seqs — the card is explicit that max-num-seqs governs
      throughput). KV is bf16 ON PURPOSE: surya's per-block `confidence` is
      the mean per-token probability of the decode and epubocr thresholds on
      it, so fp8 KV would move numbers a downstream consumer reads.
  - alias: chandra-ocr-2
    recipe: /mnt/c/Coding/rivaborn/LLMConfig/dgx_sparks/recipes/local/chandra-ocr-2-spark.yaml
    served_name: chandra-ocr-2
    tp: 1
    status: unverified
    mem_fraction: 0.22
    load_timeout_s: 900
    notes: >-
      datalab-to/chandra-ocr-2 @af93b47d, 9.88 GiB — the heavier datalab OCR
      model. NEVER run in this lab: the recipe is surya's proven flag set
      scaled up, so the sizing is a starting point, not a measurement. Card
      benchmarks 96 concurrent seqs on an H100 80GB; 32 here is a deliberate
      step down for GB10 memory bandwidth. The chandra-ocr package ships a
      `chandra_vllm` launcher whose flags are unpublished — look there first
      if output quality disappoints.
