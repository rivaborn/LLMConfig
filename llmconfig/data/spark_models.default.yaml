# Curated sparkrun recipes for a single DGX Spark (GB10) node.
#
# Seeded into ../../data/spark_models_<unit>.yaml on first run, then editable per
# node through the UI / API. sparkrun's synced registries carry ~147 models; this
# is the small set this lab actually serves, mirroring the vLLM alias registry.
#
# `recipe` must be a name sparkrun can resolve — they are NAMESPACED by registry
# (`@eugr/…`, `@official/…`, `@sparkrun-transitional/…`). Check with
# `sparkrun search <text>` or `sparkrun list`; a bare guess fails with
# "Recipe '<name>' not found".
#
# `served_name` is pinned onto the launch via `--served-model-name`, so the node
# reports exactly this string and readiness/`/v1` resolution can't drift from
# whatever the recipe would otherwise default to. It is also the id you use as
# `model` against the /v1 gateway.
#
# tp = node count. Everything here is tp: 1 — the 200G switch has not been
# delivered, so the four Sparks run as independent single-node servers. Raise tp
# only after the fabric is up (see the wiki runbook), and only for a recipe whose
# `Nodes` column in `sparkrun list` supports it.
#
# status: "unverified" until it has been launched and recall-tested on THIS
# cluster. The decode figures in the notes are community numbers from the Spark
# Arena leaderboard, not measurements from this lab.
models:
  # The first model actually launched on this cluster (shakedown 2026-07-24).
  # The recipe defaults to tensor_parallel: 2 and max_model_len: 262144 — sized for
  # two nodes. On one node that KV cache does not fit beside the weights at
  # gpu_memory_utilization 0.8, so tp is 1 here and the context is pinned in
  # extra_args. Raise both only after the 200G switch makes multi-node real.
  # served_name carries the quant, following the vLLM-registry convention
  # (coder30-awq, q36-27b-abl). It must NOT be a bare "gemma-4-26b": the 3090
  # already serves that name from cyankiwi/…-AWQ-4bit at 32k ctx, and an
  # un-laned /v1 request silently resolved to that instead of this fp8/65k build
  # — same model id, different weights and half the context.
  - alias: gemma-4-26b
    recipe: "@eugr/gemma4-26b-a4b"
    served_name: gemma-4-26b-fp8
    tp: 1
    status: ok
    extra_args: ["--max-model-len", "65536"]
    notes: >-
      google/gemma-4-26B-A4B-it, MoE 26B/4B-active, served fp8 with fp8 KV.
      65536 ctx clears opencode's ~24.5k baseline with room. VERIFIED on all four
      nodes 2026-07-24 — real completions through the LLMConfig /v1 gateway in
      0.6-1.1 s, ~85-89% of the 122 GB unified pool resident. Weights download as
      ~48 GB bf16 and are quantized at load, so a node's FIRST load is a long pull
      (~50 min cold); later loads hit the local HF cache (~7 min).
    load_timeout_s: 3600

  - alias: gpt-oss-120b
    recipe: "@eugr/openai-gpt-oss-120b"
    served_name: gpt-oss-120b
    tp: 1
    status: unverified
    extra_args: ["--max-model-len", "65536"]
    notes: "MXFP4 via vllm-distributed. Community 1-node decode ~58.8 t/s, strong prefill (~6000 t/s)."
    load_timeout_s: 1200

  - alias: qwen3-coder-next
    recipe: "@official/qwen3-coder-next-int4-autoround-vllm"
    served_name: qwen3-coder-next
    tp: 1
    status: unverified
    extra_args: ["--max-model-len", "65536"]
    notes: "INT4 AutoRound. Community 1-node decode ~73.3 t/s — fastest on a single node."
    load_timeout_s: 900

  - alias: qwen35-35b-a3b
    recipe: "@sparkrun-transitional/qwen3.5-35b-a3b-fp8-sglang"
    served_name: qwen35-35b-a3b
    tp: 1
    status: unverified
    extra_args: ["--max-model-len", "65536"]
    notes: "FP8 MoE on SGLang. ~50.8 t/s single-stream, ~196 t/s aggregate at c10."
    load_timeout_s: 900

  - alias: qwen35-27b
    recipe: "@sparkrun-transitional/qwen3.5-27b-fp8-sglang"
    served_name: qwen35-27b
    tp: 1
    status: unverified
    extra_args: ["--max-model-len", "65536"]
    notes: "FP8 dense 27B on SGLang, single node."
    load_timeout_s: 900
