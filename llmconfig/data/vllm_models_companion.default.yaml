# Default vLLM alias catalog for the COMPANION lane (RTX 3070 Ti, 8 GB).
# Seeded into ./data/vllm_models_companion.yaml on first run. These aliases must
# mirror the `serve-companion.sh` alias table on the box (pins the 3070 Ti UUID,
# per-alias --gpu-memory-utilization). `served_name` is what /v1/models reports.
# Edit the generated ./data/vllm_models_companion.yaml (this is the default).
#
# The daily-driver pair below co-resides via SLOT mode (COMPANION_VLLM_SLOTS):
# each alias runs as its own vllm-companion@<alias> systemd instance on its own
# port/relay, so a reload of one never blips the other. Budgets: surya2 at
# --gpu-memory-utilization 0.55 (~4.5 GB), the relay at 0.25 (~2 GB) — 0.80 of
# 8192 committed + 600 MiB driver baseline leaves ~1 GB slack.
aliases:
  - alias: surya2
    hf_repo: datalab-to/surya-ocr-2
    served_name: surya-ocr-2
    mode: eager
    status: ok
    notes: >-
      Surya-2 OCR VLM (1.37 GiB bf16 measured) for epubocr — needs vLLM
      (logprobs feed the per-block confidence scores; --mm-processor-kwargs
      pixel bounds). Slot-mode resident beside the opencode relay; verified
      2026-07-31. Window 12288 / max_pixels 2359296 / util 0.54 — the 8 GB fit
      took three profile iterations, see serve-companion.sh's case comments
      before touching any of those numbers.
    load_timeout_s: 300
    managed_by: serve.sh

  - alias: qwen25-relay
    hf_repo: Qwen/Qwen2.5-1.5B-Instruct-AWQ
    served_name: qwen2.5-1.5b
    mode: eager
    status: ok
    notes: >-
      The opencode /swap echo relay, vLLM-served (replaces the Ollama tag
      qwen2.5:1.5b — Ollama declares no budget and cannot join a budgeted
      card). Verified 2026-07-31: AWQ weights CPU-offloaded (chassis PCIe, not
      the eGPU), fp8_e5m2 KV, util 0.30, --max-model-len 32768 so opencode's
      ~24.5k baseline prompt fits. Slot-mode resident beside surya2.
    load_timeout_s: 180
    managed_by: serve.sh

  - alias: smoke
    hf_repo: Qwen/Qwen2.5-0.5B-Instruct
    served_name: smoke
    mode: compile
    status: unverified
    notes: >-
      Companion sanity check (~1 GB). NO slot by default — loading it in slot
      mode needs a COMPANION_VLLM_SLOTS entry. Also the fallback relay model if
      the 1.5B + surya2 split proves too tight on 8 GB.
    load_timeout_s: 120
    managed_by: serve.sh
