<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLMConfig</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="brand">LLM<span>Config</span></div>
    <!-- Tabs are built at runtime from /api/lanes: Home, one per LLM unit
         (3090 / 3070 Ti / each DGX Spark), then Monitor. -->
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
    <details class="keybox">
      <summary>⚙</summary>
      <label>API key <input id="apikey" type="password" placeholder="X-API-Key (if set)" /></label>
    </details>
  </header>

  <!-- Home: one box per LLM unit with its resident models + a quick-switch dropdown. -->
  <section id="view-home" class="view active" role="tabpanel">
    <p class="hint">Every LLM unit at a glance. Pick a model to load it on that unit — a GPU lane
      swaps to it (one model per card), a Spark adds it alongside whatever is already resident.</p>
    <!-- Cookbook: named fleet states — save what's loaded where, get back to it later. -->
    <div id="cookbook-bar" class="cookbook-bar">
      <span class="cb-label">Cookbook</span>
      <select id="cb-select" aria-label="Saved fleet states"></select>
      <button class="btn" id="cb-apply" title="Load exactly this state's models on every unit">Apply</button>
      <button class="btn" id="cb-save" title="Save what is loaded right now as a named state">Save current…</button>
      <button class="btn" id="cb-default" title="Mark the selected state as the startup default">Set default</button>
      <button class="btn btn-warn" id="cb-delete" title="Delete the selected state">✕</button>
      <span class="cb-note" id="cb-note"></span>
    </div>
    <div id="unit-grid" class="unit-grid"></div>
  </section>

  <!-- Per-unit views are injected here by app.js (id="view-<unitId>"). -->
  <div id="unit-views"></div>

  <section id="view-monitor" class="view" role="tabpanel" hidden>
    <div id="offload-banner" class="offload-banner" hidden></div>

    <div id="instruments" class="instruments"></div>

    <div class="board-head">
      <div class="seg" id="metric-seg" role="group" aria-label="Metric">
        <button class="seg-btn active" data-metric="temp">Temperature</button>
        <button class="seg-btn" data-metric="power">Power</button>
        <button class="seg-btn" data-metric="vram">VRAM</button>
        <button class="seg-btn" data-metric="llm">LLM split</button>
      </div>
      <div class="seg" id="window-seg" role="group" aria-label="Time window">
        <button class="seg-btn" data-window="3600">1h</button>
        <button class="seg-btn active" data-window="14400">4h</button>
        <button class="seg-btn" data-window="43200">12h</button>
        <button class="seg-btn" data-window="86400">24h</button>
      </div>
    </div>

    <div id="charts" class="charts"></div>
    <p id="monitor-note" class="monitor-note"></p>
  </section>

  <!-- One shared activity log for every view (a DOM node can only live in one
       place, and job output is global anyway). Collapsible so it stays out of
       the way on the Monitor tab. -->
  <details class="activity" id="activity" open>
    <summary>Activity</summary>
    <pre id="log" class="log">idle</pre>
  </details>

  <script src="/static/app.js" defer></script>
  <script src="/static/monitor.js" defer></script>
</body>
</html>
